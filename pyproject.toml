[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "solarff"
version = "1.3.0"
description = "Nonlinear force-free field (NLFFF) extrapolation of the solar coronal magnetic field from SDO/HMI vector magnetograms, with field-line tracing, a per-line confidence, energy, helicity and eruptivity diagnostics"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel García" }]
keywords = ["solar physics", "NLFFF", "nonlinear force-free field", "magnetic field extrapolation", "solar corona",
            "coronal magnetic field", "SDO", "HMI", "SHARP", "potential field", "linear force-free field",
            "magnetic helicity", "free energy", "field lines", "heliophysics", "space weather"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "astropy>=5.3",
]

[project.optional-dependencies]
jsoc = ["drms>=0.7"]                 # download of SHARP data from JSOC
lbfgs = ["torch>=2.0"]               # NLFFF with exact gradient and relaxed base (recommended)
all = ["drms>=0.7", "torch>=2.0"]
calibration = ["scikit-learn>=1.3"]  # comparison of classifiers (solarff.calibration)
aia = ["sunpy[map]>=6.0", "drms>=0.7"]  # validation with AIA loops (solarff.aia)
dev = ["pytest>=7"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]  # documentation site (mkdocs serve)

[project.urls]
Homepage = "https://github.com/gabgarar/solarff"
Documentation = "https://gabgarar.github.io/solarff/"
Issues = "https://github.com/gabgarar/solarff/issues"
Changelog = "https://github.com/gabgarar/solarff/releases"
DOI = "https://doi.org/10.5281/zenodo.24133574"

[tool.setuptools.packages.find]
include = ["solarff*"]

[tool.setuptools.package-data]
solarff = ["calibration_cv.json", "bias_validation.json", "robustness.json", "flux_rope_test.json",
           "flux_rope_test_relax.json", "divergence_weight.json", "tracing_step.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: tarda minutos (p. ej. el NLFFF de Low & Lou a 64^3); ejecutar con  pytest -m slow",
    "needs_data: usa datos fuera de git (data/); se salta si no están",
]
