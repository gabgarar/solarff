[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "solarff"
version = "1.1.0"
description = "Extrapolation of solar magnetic fields (potential, LFFF, NLFFF) from SDO/HMI vector magnetograms, with field-line tracing and a calibrated per-line confidence"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel García" }]
keywords = ["solar physics", "NLFFF", "magnetic field extrapolation", "field-line reliability"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "astropy>=5.3",
]

[project.optional-dependencies]
jsoc = ["drms>=0.7"]                 # download of SHARP data from JSOC
lbfgs = ["torch>=2.0"]               # NLFFF with exact gradient and relaxed base (recommended)
all = ["drms>=0.7", "torch>=2.0"]
calibration = ["scikit-learn>=1.3"]  # comparison of classifiers (solarff.calibration)
aia = ["sunpy[map]>=6.0", "drms>=0.7"]  # validation with AIA loops (solarff.aia)
dev = ["pytest>=7"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]  # documentation site (mkdocs serve)

[project.urls]
Homepage = "https://github.com/gabgarar/solarff"
Documentation = "https://gabgarar.github.io/solarff/"
Issues = "https://github.com/gabgarar/solarff/issues"

[tool.setuptools.packages.find]
include = ["solarff*"]

[tool.setuptools.package-data]
solarff = ["calibration_cv.json", "bias_validation.json", "robustness.json", "flux_rope_test.json",
           "flux_rope_test_relax.json", "divergence_weight.json", "tracing_step.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: tarda minutos (p. ej. el NLFFF de Low & Lou a 64^3); ejecutar con  pytest -m slow",
    "needs_data: usa datos fuera de git (data/); se salta si no están",
]
