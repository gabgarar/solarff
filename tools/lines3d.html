<script>
const D = /*DATA*/;
const THR = D.threshold;

// ---------------------------------------------------------------- texts (English and Spanish)
const TXT = {
  en: {
    title: "Field lines in 3D", fold: "Fold the panel", other: "ES", other_title: "Ver en español",
    region: "Region", colour: "Colour", apex: "Height", conf: "Confidence", model: "Models",
    view: "View", top: "Top", side: "Side",
    vec: "Vector field", none: "None", obs: "Observed", pp: "Preprocessed", ext: "Extrapolated", level: "Height",
    show: "Show", lines: "Field lines", rej: "Rejected lines", mag: "Magnetogram at the base",
    pil: "Polarity inversion line", box: "Computational box", rot: "Rotate", exag: "Height ×", legend: "Legend",
    png: "Save PNG image",
    help_mouse: "Drag: rotate · Wheel: zoom · Right button: pan<br>Hover over a line to see its confidence",
    help_touch: "One finger: rotate · Two fingers: zoom and pan · Tap a line",
    sub: (n, a, p) => `${n} lines · ${a} accepted (${p}%)`,
    foot: (v, thr, k, s) => `NLFFF extrapolation with solarff ${v}. Confidence of each line from the five-term model; ` +
      `a line is accepted from ${thr}. Seeds ${k === 1 ? "at every pixel" : `every ${k} pixels in x and in y`} ` +
      `where |B<sub>z</sub>| exceeds ${Math.round(100 * s)}% of its maximum.`,
    vec_name: {
      obs: "Horizontal field of the magnetogram, at the pixel of the computation",
      pp: "Preprocessed horizontal field: the one that enters the extrapolation",
      ext: "Extrapolated horizontal field; the plane shows B<sub>z</sub> at that height, with its own grey scale",
    },
    vec_info: (d, k, ref) => `One arrow every ${d} Mm (mean of ${k}×${k} pixels). Longest arrow: <b>${ref} G</b> or more.`,
    rej_leg: `Rejected (confidence &lt; ${THR})`,
    apex_t: "Apex height of the accepted lines", conf_all: "Confidence of each line",
    conf_mark: "The white mark is the acceptance threshold.", conf_acc: "Confidence of the accepted lines",
    both: "Accepted by both models", only4: "Only by that of 1.1 (four terms)",
    only5: "Only by the current one (five terms)", rej_both: "Rejected by both",
    line: (i, closed) => `Line ${i} · ${closed ? "closed" : "open, leaves the box"}`,
    confw: "Confidence", acc: "accepted", rejw: "rejected", prev: "With the previous model:",
    apexlen: (a, L) => `Apex ${a} Mm · length ${L} Mm`, file: "lines", pct: "%",
  },
  es: {
    title: "Líneas de campo en 3D", fold: "Plegar el panel", other: "EN", other_title: "View in English",
    region: "Región", colour: "Color", apex: "Altura", conf: "Confianza", model: "Modelos",
    view: "Vista", top: "Arriba", side: "Lado",
    vec: "Campo vectorial", none: "Ninguno", obs: "Observado", pp: "Preprocesado", ext: "Extrapolado", level: "Altura",
    show: "Mostrar", lines: "Líneas de campo", rej: "Líneas rechazadas", mag: "Magnetograma en la base",
    pil: "Línea de inversión de polaridad", box: "Caja de cálculo", rot: "Girar sola", exag: "Altura ×", legend: "Leyenda",
    png: "Guardar imagen PNG",
    help_mouse: "Arrastrar: girar · Rueda: acercar · Botón derecho: desplazar<br>Pasa el ratón por una línea para ver su confianza",
    help_touch: "Un dedo: girar · Dos dedos: acercar y desplazar · Toca una línea",
    sub: (n, a, p) => `${n} líneas · ${a} aceptadas (${p} %)`,
    foot: (v, thr, k, s) => `Extrapolación NLFFF con solarff ${v}. Confianza de cada línea según el modelo de cinco términos; ` +
      `se acepta desde ${thr}. Semillas ${k === 1 ? "en cada píxel" : `cada ${k} píxeles en x y en y`} ` +
      `donde |B<sub>z</sub>| supera el ${Math.round(100 * s)} % de su máximo.`,
    vec_name: {
      obs: "Campo horizontal del magnetograma, al píxel del cálculo",
      pp: "Campo horizontal preprocesado: el que entra en la extrapolación",
      ext: "Campo horizontal extrapolado; el plano muestra B<sub>z</sub> a esa altura, con su propia escala de grises",
    },
    vec_info: (d, k, ref) => `Una flecha cada ${d} Mm (media de ${k}×${k} píxeles). Flecha más larga: <b>${ref} G</b> o más.`,
    rej_leg: `Rechazada (confianza &lt; ${THR})`,
    apex_t: "Altura máxima de las líneas aceptadas", conf_all: "Confianza de cada línea",
    conf_mark: "La marca blanca es el umbral de aceptación.", conf_acc: "Confianza de las líneas aceptadas",
    both: "Aceptada con los dos modelos", only4: "Sólo con el de la 1.1 (cuatro términos)",
    only5: "Sólo con el actual (cinco términos)", rej_both: "Rechazada con los dos",
    line: (i, closed) => `Línea ${i} · ${closed ? "cerrada" : "abierta, sale de la caja"}`,
    confw: "Confianza", acc: "aceptada", rejw: "rechazada", prev: "Con el modelo anterior:",
    apexlen: (a, L) => `Altura máxima ${a} Mm · longitud ${L} Mm`, file: "lineas", pct: " %",
  },
};

const STOPS = {
  apex: ["#1d4c9e", "#2a78d6", "#4fa3f0", "#9fd0ff", "#eef7ff"],
  conf: ["#3b1c6e", "#7a2a9a", "#c23f7f", "#f07a4a", "#fbd44c"],
};
const C = { both: "#4b93ec", only4: "#f07d4c", only5: "#2fd18f", rej: "#8b93a1", pil: "#ffd84d", box: "#56607a", vec: "#33e6d2" };
const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const RAMP = { apex: STOPS.apex.map(hex), conf: STOPS.conf.map(hex) };
function ramp(name, t) {
  const s = RAMP[name], n = s.length - 1;
  t = Math.min(1, Math.max(0, t));
  const k = Math.min(n - 1, Math.floor(t * n)), u = t * n - k, a = s[k], b = s[k + 1];
  return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];
}

// ---------------------------------------------------------------- state (the hash can set it: #region=12673&mode=model&view=top&rotate=0&lang=es)
const H = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const S = {
  lang: TXT[H.lang] ? H.lang : TXT[D.lang] ? D.lang : "en",
  region: D.regions[H.region] ? H.region : Object.keys(D.regions)[0],
  mode: ["apex", "conf", "model"].includes(H.mode) ? H.mode : "apex",
  view: ["3d", "top", "side"].includes(H.view) ? H.view : "3d",
  rej: H.rej !== "0", mag: true, pil: true, box: true, rot: H.rotate !== "0", exag: 1,
  vec: ["none", "obs", "pp", "ext"].includes(H.vec) ? H.vec : "none", level: +H.level || 0, lines: H.lines !== "0",
};
const T = () => TXT[S.lang];

// ---------------------------------------------------------------- renderer, camera, controls
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
{
  const cv = document.createElement("canvas"); cv.width = cv.height = 512;
  const g = cv.getContext("2d"), gr = g.createRadialGradient(256, 190, 10, 256, 256, 420);
  gr.addColorStop(0, "#1b2433"); gr.addColorStop(1, "#090c13");
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  scene.background = new THREE.CanvasTexture(cv);
}
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 1, 40000);
camera.up.set(0, 0, 1);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.autoRotateSpeed = 0.6;
controls.addEventListener("start", () => { if (S.rot) { S.rot = false; $("c-rot").checked = false; controls.autoRotate = false; } tween = null; });

const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- regions
function i16(b64) {
  const bin = atob(b64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Int16Array(u8.buffer);
}
function decode(R) {
  const q = i16(R.points), pos = new Float32Array(q.length);
  for (let i = 0; i < q.length; i++) pos[i] = q[i] / R.q;
  const n = R.counts.length, start = new Int32Array(n), vl = new Int32Array(q.length / 3);
  let s = 0;
  for (let i = 0; i < n; i++) { start[i] = s; vl.fill(i, s, s + R.counts[i]); s += R.counts[i]; }
  return { pos, start, vl };
}

function label(text, size) {
  const cv = document.createElement("canvas"), g = cv.getContext("2d");
  cv.width = 256; cv.height = 64;
  g.font = "500 34px system-ui, Segoe UI, sans-serif"; g.fillStyle = "#c9d1dc"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(text, 128, 32);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthWrite: false, transparent: true }));
  sp.scale.set(size * 4, size, 1);
  return sp;
}

const built = {};
function buildRegion(key) {
  if (built[key]) return built[key];
  const R = D.regions[key], { pos, start, vl } = decode(R);
  const [x0, x1, y0, y1, , z1] = R.box, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, Lx = x1 - x0, Ly = y1 - y0, Lz = z1;
  const root = new THREE.Group(); root.position.set(-cx, -cy, 0);
  const B = { key, R, pos, start, vl, root, Lx, Ly, Lz, n: R.counts.length };
  B.posAttr = new THREE.BufferAttribute(pos, 3);
  const tmp = new THREE.BufferGeometry(); tmp.setAttribute("position", B.posAttr); tmp.computeBoundingSphere();
  B.sphere = tmp.boundingSphere;
  let ma = 0; for (let i = 0; i < B.n; i++) if (R.acc5[i] && R.apex[i] > ma) ma = R.apex[i];
  B.maxApex = ma || Lz;
  // magnetogram
  const tex = new THREE.TextureLoader().load("data:image/png;base64," + R.bz_png);
  tex.minFilter = THREE.LinearFilter;
  B.plane = new THREE.Mesh(new THREE.PlaneGeometry(Lx, Ly), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
  B.plane.position.set(cx, cy, -0.15);
  root.add(B.plane);
  // polarity inversion line
  B.pil = new THREE.Group();
  const pm = new THREE.LineBasicMaterial({ color: C.pil });
  for (const seg of R.pil) {
    const g = new THREE.BufferGeometry().setFromPoints(seg.map(p => new THREE.Vector3(p[0], p[1], 0.25)));
    B.pil.add(new THREE.Line(g, pm));
  }
  root.add(B.pil);
  // box and scale bar
  B.box = new THREE.Group();
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(Lx, Ly, Lz)),
    new THREE.LineBasicMaterial({ color: C.box, transparent: true, opacity: 0.7 }));
  edges.position.set(cx, cy, Lz / 2);
  B.box.add(edges);
  const L = [10, 20, 50, 100, 200, 500].filter(v => v <= 0.3 * Lx).pop() || 5, yb = y0 - 0.05 * Ly, tk = 0.015 * Ly;
  const bar = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(x0, yb, 0), new THREE.Vector3(x0 + L, yb, 0),
    new THREE.Vector3(x0, yb - tk, 0), new THREE.Vector3(x0, yb + tk, 0),
    new THREE.Vector3(x0 + L, yb - tk, 0), new THREE.Vector3(x0 + L, yb + tk, 0)]),
    new THREE.LineBasicMaterial({ color: "#c9d1dc" }));
  B.box.add(bar);
  const lb = label(L + " Mm", 0.028 * Math.max(Lx, Ly)); lb.position.set(x0 + L / 2, yb - 0.06 * Ly, 0);
  B.box.add(lb);
  root.add(B.box);
  // lines: one object for coloured lines, one for grey ones
  B.matA = new THREE.LineBasicMaterial({ vertexColors: true });
  B.matR = new THREE.LineBasicMaterial({ color: C.rej, transparent: true, opacity: 0.2, depthWrite: false });
  B.matH = new THREE.LineBasicMaterial({ color: "#ff4fd8", depthTest: false, transparent: true });
  B.objA = new THREE.LineSegments(new THREE.BufferGeometry(), B.matA);
  B.objR = new THREE.LineSegments(new THREE.BufferGeometry(), B.matR);
  B.hi = new THREE.Line(new THREE.BufferGeometry(), B.matH); B.hi.renderOrder = 10; B.hi.visible = false;
  root.add(B.objR, B.objA, B.hi);
  // vector field: arrows of the horizontal field, and for the extrapolation a plane with B_z at the chosen height
  const V = R.vec;
  B.vobs = V.obs ? i16(V.obs.data) : null; B.vpp = V.pp ? i16(V.pp.data) : null; B.vext = i16(V.ext.data); B.sliceTex = [];
  B.arrows = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: C.vec }));
  B.slice = new THREE.Mesh(new THREE.PlaneGeometry(Lx, Ly),
    new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, transparent: true, opacity: 0.8 }));
  B.slice.position.set(cx, cy, 0);
  root.add(B.arrows, B.slice);
  // categories by model
  B.cat = R.acc5.map((a5, i) => { const a4 = R.acc4[i]; return a5 && a4 ? "both" : a4 ? "only4" : a5 ? "only5" : "rej"; });
  built[key] = B;
  return B;
}

function geometry(B, idx, n, col) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", B.posAttr);
  if (col) g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  g.setIndex(new THREE.BufferAttribute(idx.slice(0, n), 1));
  g.boundingSphere = B.sphere;
  return g;
}

function rebuild() {
  const B = cur, R = B.R, nv = B.pos.length / 3;
  const ia = new Uint32Array(2 * nv), ir = new Uint32Array(2 * nv), col = new Float32Array(3 * nv);
  let na = 0, nr = 0;
  const fixed = { both: hex(C.both), only4: hex(C.only4), only5: hex(C.only5) };
  for (let i = 0; i < B.n; i++) {
    const c5 = R.conf5[i];
    let rgb = null;
    if (S.mode === "apex") rgb = R.acc5[i] ? ramp("apex", R.apex[i] / B.maxApex) : null;
    else if (S.mode === "conf") rgb = S.rej ? ramp("conf", c5) : R.acc5[i] ? ramp("conf", (c5 - THR) / (1 - THR)) : null;   // only accepted: scale from the threshold
    else rgb = fixed[B.cat[i]] || null;
    const s = B.start[i], m = R.counts[i];
    if (rgb) {
      for (let k = s; k < s + m; k++) { col[3 * k] = rgb[0]; col[3 * k + 1] = rgb[1]; col[3 * k + 2] = rgb[2]; }
      for (let k = s; k < s + m - 1; k++) { ia[na++] = k; ia[na++] = k + 1; }
    } else if (S.rej && S.mode !== "conf") {
      for (let k = s; k < s + m - 1; k++) { ir[nr++] = k; ir[nr++] = k + 1; }
    }
  }
  B.objA.geometry.dispose(); B.objR.geometry.dispose();
  B.objA.geometry = geometry(B, ia, na, col);
  B.objR.geometry = geometry(B, ir, nr, null);
  legend();
}

// ---------------------------------------------------------------- panel
let cur = null;
function setRegion(key) {
  if (cur) scene.remove(cur.root);
  cur = buildRegion(key); S.region = key;
  scene.add(cur.root);
  const nz = cur.R.vec.z.length;
  S.level = Math.min(S.level, nz - 1); $("level").max = nz - 1; $("level").value = S.level;
  for (const b of $("vecs").children) b.style.display = b.dataset.v === "obs" || b.dataset.v === "pp" ? (cur.R.vec[b.dataset.v] ? "" : "none") : "";
  if ((S.vec === "obs" || S.vec === "pp") && !cur.R.vec[S.vec]) S.vec = "none";
  applyToggles(); rebuild(); drawVectors(); setView(S.view, false); subtitle();
  for (const b of $("regions").children) b.classList.toggle("on", b.dataset.v === key);
  hideTip();
}
function subtitle() {
  const R = cur.R, acc = R.acc5.filter(Boolean).length;
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  $("sub").innerHTML = R.label.split(" · ").map(p => `<span class="nw">${esc(p)}</span>`).join(" · ");   // breaks only between parts
  $("sub2").textContent = T().sub(cur.n, acc, cur.n ? Math.round(100 * acc / cur.n) : 0);
}
function drawVectors() {
  const B = cur, V = B.R.vec, n = V.nx * V.ny, on = S.vec !== "none";
  B.arrows.visible = on; B.slice.visible = S.vec === "ext";
  $("vec-row").style.display = S.vec === "ext" ? "flex" : "none";
  for (const b of $("vecs").children) b.classList.toggle("on", b.dataset.v === S.vec);
  if (!on) { $("vec-info").innerHTML = ""; return; }
  let arr, s, z = 0;
  if (S.vec === "ext") {
    const k = S.level; arr = B.vext.subarray(3 * n * k, 3 * n * (k + 1)); s = V.ext.scale[k]; z = V.z[k];
    if (!B.sliceTex[k]) { B.sliceTex[k] = new THREE.TextureLoader().load("data:image/png;base64," + V.ext.png[k]); B.sliceTex[k].minFilter = THREE.LinearFilter; }
    B.slice.material.map = B.sliceTex[k]; B.slice.material.needsUpdate = true;
    B.slice.position.z = z + 0.1;
    $("level-v").textContent = z.toFixed(1) + " Mm";
  } else if (S.vec === "obs") { arr = B.vobs; s = V.obs.scale; }
  else { arr = B.vpp; s = V.pp.scale; }
  // arrow length proportional to |B_h| up to the 98th percentile of the layer; the weakest (under 8 % of it) are not drawn
  const bh = new Float32Array(n);
  for (let i = 0; i < n; i++) bh[i] = Math.hypot(arr[3 * i], arr[3 * i + 1]) * s;
  const ref = Float32Array.from(bh).sort()[Math.floor(0.98 * (n - 1))] || 1;
  const Lmax = 1.8 * V.d, ca = Math.cos(0.45), sa = Math.sin(0.45), zz = z + 0.35, p = [];
  for (let i = 0; i < n; i++) {
    if (bh[i] < 0.08 * ref) continue;
    const x = V.x0 + Math.floor(i / V.ny) * V.d, y = V.y0 + (i % V.ny) * V.d;
    const L = Lmax * Math.min(1, bh[i] / ref), ux = arr[3 * i] * s / bh[i], uy = arr[3 * i + 1] * s / bh[i];
    const tx = x + ux * L / 2, ty = y + uy * L / 2, h = 0.35 * L;
    p.push(x - ux * L / 2, y - uy * L / 2, zz, tx, ty, zz);
    p.push(tx, ty, zz, tx - h * (ca * ux - sa * uy), ty - h * (sa * ux + ca * uy), zz);
    p.push(tx, ty, zz, tx - h * (ca * ux + sa * uy), ty - h * (-sa * ux + ca * uy), zz);
  }
  B.arrows.geometry.dispose();
  B.arrows.geometry = new THREE.BufferGeometry();
  B.arrows.geometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array(p), 3));
  $("vec-info").innerHTML = `<span style="color:${C.vec}">➝</span> ${T().vec_name[S.vec]}. ${T().vec_info(V.d.toFixed(1), V.k, ref.toFixed(0))}`;
}
function applyToggles() {
  cur.plane.visible = S.mag; cur.pil.visible = S.pil; cur.box.visible = S.box;
  cur.objA.visible = cur.objR.visible = S.lines;
  cur.root.scale.z = S.exag;
  controls.autoRotate = S.rot;
}
function legend() {
  const B = cur, t = T(), g = name => `linear-gradient(90deg, ${STOPS[name].join(", ")})`;
  const rej = `<div class="sw"><i style="background:${C.rej};opacity:.6"></i>${t.rej_leg}</div>`;
  const pil = S.pil ? `<div class="sw"><i style="background:${C.pil}"></i>${t.pil}</div>` : "";
  let h = "";
  if (S.mode === "apex") {
    h = `<div>${t.apex_t}</div><div class="bar" style="background:${g("apex")}"></div>
         <div class="ticks"><span>0</span><span>${(B.maxApex / 2).toFixed(0)}</span><span>${B.maxApex.toFixed(0)} Mm</span></div>` + (S.rej ? rej : "");
  } else if (S.mode === "conf") {
    h = S.rej
      ? `<div>${t.conf_all}</div><div class="bar" style="background:${g("conf")}">
         <span class="mark" style="left:calc(${100 * THR}% - 1px)"></span></div>
         <div class="ticks"><span>0</span><span style="position:absolute;left:${100 * THR}%;transform:translateX(-50%)">${THR}</span><span>1</span></div>
         <div class="foot" style="margin-top:4px">${t.conf_mark}</div>`
      : `<div>${t.conf_acc}</div><div class="bar" style="background:${g("conf")}"></div>
         <div class="ticks"><span>${THR}</span><span>${((1 + THR) / 2).toFixed(1)}</span><span>1</span></div>`;
  } else {
    const k = c => B.cat.filter(x => x === c).length;
    h = `<div class="sw"><i style="background:${C.both}"></i>${t.both}<b>${k("both")}</b></div>
         <div class="sw"><i style="background:${C.only4}"></i>${t.only4}<b>${k("only4")}</b></div>
         <div class="sw"><i style="background:${C.only5}"></i>${t.only5}<b>${k("only5")}</b></div>
         <div class="sw"><i style="background:${C.rej};opacity:.6"></i>${t.rej_both}<b>${k("rej")}</b></div>`;
  }
  $("legend").innerHTML = h + pil;
  for (const b of $("modes").children) b.classList.toggle("on", b.dataset.v === S.mode);
}
// every text of the page in the chosen language
function texts() {
  const t = T();
  document.documentElement.lang = S.lang; document.title = t.title;
  for (const el of document.querySelectorAll("[data-t]")) el.innerHTML = t[el.dataset.t];
  $("fold").title = t.fold; $("lang").textContent = t.other; $("lang").title = t.other_title;
  $("foot").innerHTML = t.foot(D.version, THR, D.every, D.seed_threshold);
  if (cur) { subtitle(); legend(); drawVectors(); hideTip(); }
}

for (const key of Object.keys(D.regions)) {
  const b = document.createElement("button"); b.dataset.v = key; b.textContent = key; b.title = D.regions[key].label; $("regions").append(b);
}
if (Object.keys(D.regions).length < 2) $("region-block").style.display = "none";
$("regions").onclick = e => { const v = e.target.dataset.v; if (v && v !== S.region) setRegion(v); };
$("modes").onclick = e => { const v = e.target.dataset.v; if (v) { S.mode = v; rebuild(); hideTip(); } };
$("views").onclick = e => { const v = e.target.dataset.v; if (v) setView(v, true); };
$("vecs").onclick = e => { const v = e.target.dataset.v; if (v) { S.vec = v; drawVectors(); } };
$("level").oninput = e => { S.level = +e.target.value; drawVectors(); };
$("c-lines").checked = S.lines;
$("c-lines").onchange = e => { S.lines = e.target.checked; applyToggles(); hideTip(); };
$("c-rej").checked = S.rej; $("c-rot").checked = S.rot;
$("c-rej").onchange = e => { S.rej = e.target.checked; rebuild(); hideTip(); };
$("c-mag").onchange = e => { S.mag = e.target.checked; applyToggles(); };
$("c-pil").onchange = e => { S.pil = e.target.checked; applyToggles(); legend(); };
$("c-box").onchange = e => { S.box = e.target.checked; applyToggles(); };
$("c-rot").onchange = e => { S.rot = e.target.checked; applyToggles(); };
$("exag").oninput = e => {
  const old = S.exag; S.exag = +e.target.value; $("exag-v").textContent = S.exag.toFixed(1); applyToggles();
  controls.target.z *= S.exag / old;
};
$("lang").onclick = () => { S.lang = S.lang === "en" ? "es" : "en"; texts(); layout(); };
$("fold").onclick = () => {
  $("panel").classList.toggle("folded"); $("fold").textContent = $("panel").classList.contains("folded") ? "▸" : "▾";
  layout(); setView(S.view, true);
};
$("png").onclick = () => {
  renderer.render(scene, camera);
  const a = document.createElement("a");
  a.href = renderer.domElement.toDataURL("image/png");
  a.download = `${T().file}_${S.region.replace(/[^\w.-]+/g, "_")}_${S.mode}.png`; a.click();
};

// ---------------------------------------------------------------- views, with a short animated move
let tween = null, PANEL = 0, PANELH = 0;
// the scene is centred in the free area: right of the panel on wide screens, above it on phones
function layout() {
  const W = innerWidth, Hh = innerHeight, open = !$("panel").classList.contains("folded");
  PANEL = W > 640 && open ? $("panel").offsetWidth + 16 : 0;
  PANELH = W <= 640 ? $("panel").offsetHeight + 12 : 0;
  camera.aspect = (W + PANEL) / (Hh + PANELH);
  if (PANEL || PANELH) camera.setViewOffset(W + PANEL, Hh + PANELH, 0, PANELH, W, Hh); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  renderer.setSize(W, Hh);
}
// the shortest distance along dir at which the whole box fits in the free area
function fitDistance(dir, target) {
  const B = cur, pts = [], cam = camera.clone();
  for (const x of [-B.Lx / 2, B.Lx / 2]) for (const y of [-B.Ly / 2, B.Ly / 2]) for (const z of [0, B.Lz * S.exag]) pts.push(new THREE.Vector3(x, y, z));
  const xmin = -1 + 2 * (PANEL + 24) / innerWidth, xmax = 1 - 48 / innerWidth;
  const ymin = -1 + 2 * (PANELH + 50) / innerHeight, ymax = 1 - 2 * (innerWidth <= 640 ? 50 : 24) / innerHeight;
  let lo = 1, hi = 15000;
  for (let it = 0; it < 40; it++) {
    const d = (lo + hi) / 2;
    cam.position.copy(dir).multiplyScalar(d).add(target); cam.lookAt(target); cam.updateMatrixWorld();
    const ok = pts.every(p => {
      if (p.clone().applyMatrix4(cam.matrixWorldInverse).z >= 0) return false;      // behind the camera
      const q = p.clone().project(cam);
      return q.x >= xmin && q.x <= xmax && q.y >= ymin && q.y <= ymax;
    });
    if (ok) hi = d; else lo = d;
  }
  return hi;
}
function setView(v, animate) {
  S.view = v;
  for (const b of $("views").children) b.classList.toggle("on", b.dataset.v === v);
  const B = cur;
  const target = new THREE.Vector3(0, 0, v === "top" ? 0 : B.Lz * S.exag * 0.3);
  const dir = (v === "top" ? new THREE.Vector3(0, -0.001, 1) : v === "side" ? new THREE.Vector3(0, -1, 0.1) : new THREE.Vector3(-0.5, -1.05, 0.8)).normalize();
  const pos = dir.clone().multiplyScalar(fitDistance(dir, target)).add(target);
  if (!animate) { camera.position.copy(pos); controls.target.copy(target); controls.update(); tween = null; return; }
  tween = { t0: performance.now(), p0: camera.position.clone(), q0: controls.target.clone(), p1: pos, q1: target };
}

// ---------------------------------------------------------------- hover: the line under the pointer
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = $("tip");
let hoverAt = null, down = null;
function hideTip() { tip.style.display = "none"; if (cur) cur.hi.visible = false; }
function pick(x, y) {
  const B = cur, t = T();
  if (!S.lines) { hideTip(); return; }
  mouse.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  ray.params.Line.threshold = camera.position.distanceTo(controls.target) * 0.006;
  const objs = [B.objA]; if (B.objR.geometry.index && B.objR.geometry.index.count) objs.push(B.objR);
  const hit = ray.intersectObjects(objs, false)[0];
  if (!hit) { hideTip(); return; }
  const i = B.vl[hit.object.geometry.index.getX(hit.index)], R = B.R, s = B.start[i], m = R.counts[i];
  B.hi.geometry.dispose();
  B.hi.geometry = new THREE.BufferGeometry();
  B.hi.geometry.setAttribute("position", new THREE.BufferAttribute(B.pos.slice(3 * s, 3 * (s + m)), 3));
  B.hi.visible = true;
  const f3 = c => (Math.floor(c * 1000) / 1000).toFixed(3);       // truncated, so 0.7996 never reads as 0.800
  const ok = R.acc5[i];
  tip.innerHTML = `<div class="t">${t.line(i + 1, R.closed[i])}</div>
    ${t.confw} <b>${f3(R.conf5[i])}</b> · <span class="${ok ? "ok" : "no"}">${ok ? t.acc : t.rejw}</span><br>
    ${t.prev} ${f3(R.conf4[i])} · ${R.acc4[i] ? t.acc : t.rejw}<br>
    ${t.apexlen(R.apex[i].toFixed(1), R.length[i].toFixed(0))}`;
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(x + 14, innerWidth - w - 8) + "px";
  tip.style.top = Math.min(y + 14, innerHeight - h - 8) + "px";
}
renderer.domElement.addEventListener("pointermove", e => { if (e.pointerType === "mouse" && !e.buttons) hoverAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerleave", hideTip);
renderer.domElement.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; hideTip(); });
renderer.domElement.addEventListener("pointerup", e => {
  if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 6 && e.pointerType !== "mouse") hoverAt = [e.clientX, e.clientY];
  down = null;
});

// ---------------------------------------------------------------- loop
addEventListener("resize", layout);
// #probe=x,y shows the tooltip at that point once the page has settled (to check the page without a mouse)
if (H.probe) setTimeout(() => { pick(...H.probe.split(",").map(Number)); renderer.render(scene, camera); }, 1500);
function frame(now) {
  if (tween) {
    let u = Math.min(1, (now - tween.t0) / 700); const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.q0, tween.q1, e);
    if (u === 1) tween = null;
  }
  controls.update();
  if (hoverAt) { pick(hoverAt[0], hoverAt[1]); hoverAt = null; }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
texts();
layout();
setRegion(S.region);
requestAnimationFrame(frame);
</script>
</body>
</html>
