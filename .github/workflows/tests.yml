name: tests
on:
  push:
    branches: [main]
    paths: ["solarff/**", "tests/**", "pyproject.toml", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install ".[calibration,aia,dev]"
      - run: python -m pytest -q
